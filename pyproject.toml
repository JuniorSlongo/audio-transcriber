[project]
name = "audio-transcriber"
version = "0.1.0"
description = "CLI para transcricao de audio com Whisper e FFmpeg local"
requires-python = ">=3.9"

[project.scripts]
audio-transcriber = "speech_to_text.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]